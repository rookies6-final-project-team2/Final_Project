# develop에 engine 변경이 머지되면 develop 태그 이미지를 빌드해 Docker Hub에 push
# (develop 태그는 덮어써도 됨)
name: Image develop

on:
  push:
    branches: [develop]
    paths: ["engine/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-develop
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_USER || 'ekrong01' }}/rookies6-engine

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER || 'ekrong01' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: develop 이미지 빌드·push
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:develop
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
