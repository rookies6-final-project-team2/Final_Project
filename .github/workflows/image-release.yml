# release/vX.Y.Z 브랜치에서 수동 실행 → vX.Y.Z-rc.N 이미지 빌드·push
# (rc 태그는 덮어쓰지 않음. 버그를 고칠 때마다 rc 번호를 올려 다시 실행)
name: Image release rc

on:
  workflow_dispatch:
    inputs:
      rc:
        description: "RC 번호 (1, 2, 3 …)"
        required: true
        type: number

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_USER || 'ekrong01' }}/rookies6-engine

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: release 브랜치 확인 및 rc 태그 계산
        id: ver
        env:
          RC: ${{ inputs.rc }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "tag=${BASH_REMATCH[1]}-rc.${RC}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::release/vX.Y.Z 브랜치를 선택해 실행하세요 (현재: $GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER || 'ekrong01' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 같은 rc 태그가 이미 있으면 중단 (덮어쓰기 금지)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG 는 이미 있습니다. rc 번호를 올려 다시 실행하세요"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: rc 이미지 빌드·push
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
